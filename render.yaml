# OPTIONAL backend deploy on Render. The site works without it (see app/direct.js). Untested; Render may ask for a card.
# Render dashboard -> New + -> Blueprint -> pick this repository -> Apply.
services:
  - type: web
    name: agrishift-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --workers 1: uvicorn otherwise reads Render's WEB_CONCURRENCY and starts several processes. Each repeats the ~90 MB baseline and keeps its OWN
    # job list, so a polling page landed on a different process every time and started duplicate NASA jobs. One process = one job list.
    # --proxy-headers: behind Render's proxy, use the visitor's real address for the rate limit instead of one shared address
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_ORIGINS          # your GitHub Pages address (origin only, no path). Change it if your username differs.
        value: https://mtahanadeem.github.io
      - key: MALLOC_ARENA_MAX         # glibc gives every thread its own memory arena; 2 cut peak memory by ~20% in tests (free instances have 512 MB)
        value: "2"
      - key: MODIS_WORKERS
        value: "4"
      - key: CACHE_DB                 # free instances have no persistent disk; the cache refills after a restart
        value: /tmp/cache.sqlite3
      # PROTOTYPE ONLY (decided by the project owner, who accepts that it is public until Monday): the NASA Earthdata token is committed here
      # so the cloud server can read recent SMAP/IMERG values without any dashboard step. Anyone can read it in this repository's history.
